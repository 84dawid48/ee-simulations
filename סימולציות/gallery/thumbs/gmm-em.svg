<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.c{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
.c2{animation-delay:-1.7s}.c3{animation-delay:-3.3s}
.m{animation:wander 8s ease-in-out infinite}.m2{animation-delay:-2.7s}.m3{animation-delay:-5.3s}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@keyframes wander{0%,100%{transform:translate(0,0)}33%{transform:translate(6px,-4px)}66%{transform:translate(-5px,4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="b" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#2a0f1a"/><stop offset="1" stop-color="#05070d"/></radialGradient><filter id="f"><feGaussianBlur stdDeviation="14"/></filter></defs>
<rect width="640" height="360" fill="url(#b)"/>
<g class="m"><g class="c"><ellipse cx="140" cy="140" rx="34" ry="90" fill="#3d8bff" filter="url(#f)" opacity=".75"/><ellipse cx="140" cy="140" rx="20" ry="55" fill="none" stroke="#9fc4ff" stroke-width="2"/><ellipse cx="140" cy="140" rx="40" ry="105" fill="none" stroke="#9fc4ff" stroke-opacity=".5" stroke-width="2"/></g></g>
<g class="m m2"><g class="c c2"><ellipse cx="320" cy="190" rx="70" ry="60" fill="#3ddc84" filter="url(#f)" opacity=".75" transform="rotate(20 320 190)"/><ellipse cx="320" cy="190" rx="45" ry="38" fill="none" stroke="#9ff0c4" stroke-width="2" transform="rotate(20 320 190)"/><ellipse cx="320" cy="190" rx="85" ry="72" fill="none" stroke="#9ff0c4" stroke-opacity=".5" stroke-width="2" transform="rotate(20 320 190)"/></g></g>
<g class="m m3"><g class="c c3"><ellipse cx="500" cy="240" rx="100" ry="40" fill="#ff4d5e" filter="url(#f)" opacity=".75" transform="rotate(-15 500 240)"/><ellipse cx="500" cy="240" rx="65" ry="26" fill="none" stroke="#ffa3ad" stroke-width="2" transform="rotate(-15 500 240)"/><ellipse cx="500" cy="240" rx="120" ry="50" fill="none" stroke="#ffa3ad" stroke-opacity=".5" stroke-width="2" transform="rotate(-15 500 240)"/></g></g>
<g fill="#fff" opacity=".85"><circle cx="135" cy="110" r="3"/><circle cx="148" cy="170" r="3"/><circle cx="140" cy="200" r="3"/><circle cx="300" cy="180" r="3"/><circle cx="340" cy="200" r="3"/><circle cx="320" cy="160" r="3"/><circle cx="470" cy="245" r="3"/><circle cx="530" cy="232" r="3"/><circle cx="500" cy="250" r="3"/><circle cx="410" cy="215" r="3"/></g></svg>
