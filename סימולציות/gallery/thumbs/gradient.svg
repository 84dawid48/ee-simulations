<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.p{stroke-dasharray:8 7;animation:run 1.6s linear infinite}
.g{transform-origin:430px 130px;animation:pulse 2.4s ease-in-out infinite}
.c{animation:climb 6s ease-in-out infinite}
@keyframes run{to{stroke-dashoffset:-30}}
@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.08)}}
@keyframes climb{0%{offset-distance:0%}80%,100%{offset-distance:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="b" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#101a36"/><stop offset="1" stop-color="#05070d"/></radialGradient><marker id="m" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#ffd479"/></marker></defs>
<rect width="640" height="360" fill="url(#b)"/>
<g stroke="#fff" stroke-opacity=".35"><ellipse cx="320" cy="180" rx="290" ry="120" fill="#1f4f8a" fill-opacity=".55"/><ellipse cx="320" cy="180" rx="225" ry="93" fill="#2a7f9a" fill-opacity=".6"/><ellipse cx="320" cy="180" rx="165" ry="68" fill="#2fb39a" fill-opacity=".6"/><ellipse cx="320" cy="180" rx="105" ry="43" fill="#8cc78a" fill-opacity=".65"/><ellipse cx="320" cy="180" rx="50" ry="21" fill="#e8d26a" fill-opacity=".75"/></g>
<path class="p" d="M430 130 C 415 165, 380 180, 320 180" fill="none" stroke="#ff9f43" stroke-width="4"/>
<line x1="380" y1="104" x2="480" y2="156" stroke="#fff" stroke-width="2" stroke-dasharray="7 6" opacity=".7"/>
<g class="g"><line x1="430" y1="130" x2="410" y2="200" stroke="#ffd479" stroke-width="6" marker-end="url(#m)"/></g>
<circle cx="430" cy="130" r="10" fill="#fff" stroke="#05070d" stroke-width="3"/>
<circle r="8" fill="#ff9f43" class="c" style="offset-path:path('M430 130 C 415 165, 380 180, 320 180')"/>
</svg>
