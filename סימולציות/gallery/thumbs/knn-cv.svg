<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.bub{transform-box:fill-box;transform-origin:center;animation:grow 4s ease-in-out infinite}
.q{animation:glow 2s ease-in-out infinite}
.d{animation:drift 6s ease-in-out infinite}.d2{animation-delay:-3s}
@keyframes grow{0%,100%{transform:scale(.75)}50%{transform:scale(1.12)}}
@keyframes glow{0%,100%{opacity:.15}50%{opacity:.45}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="b" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#0b1f33"/><stop offset="1" stop-color="#05070d"/></radialGradient><radialGradient id="s" cx=".5" cy=".5" r=".5"><stop offset=".7" stop-color="#9fd0ff" stop-opacity=".04"/><stop offset="1" stop-color="#9fd0ff" stop-opacity=".55"/></radialGradient></defs>
<rect width="640" height="360" fill="url(#b)"/>
<g class="d" fill="#ff4d5e"><circle cx="210" cy="110" r="7"/><circle cx="250" cy="90" r="7"/><circle cx="180" cy="150" r="7"/><circle cx="290" cy="130" r="7"/><circle cx="235" cy="160" r="7"/><circle cx="160" cy="95" r="7"/></g>
<g class="d d2" fill="#3ddc84"><circle cx="330" cy="200" r="7"/><circle cx="300" cy="230" r="7"/><circle cx="360" cy="180" r="7"/><circle cx="270" cy="200" r="7"/><circle cx="350" cy="240" r="7"/><circle cx="390" cy="215" r="7"/></g>
<g class="d" fill="#3d8bff"><circle cx="480" cy="280" r="7"/><circle cx="520" cy="250" r="7"/><circle cx="450" cy="300" r="7"/><circle cx="550" cy="300" r="7"/><circle cx="500" cy="320" r="7"/></g>
<circle class="bub" cx="310" cy="175" r="62" fill="url(#s)" stroke="#bfe0ff" stroke-opacity=".6"/><circle class="q" cx="310" cy="175" r="22" fill="#c9d2e6"/><circle cx="310" cy="175" r="10" fill="#eef2f8"/>
<text x="322" y="160" fill="#fff" font-family="Arial" font-weight="700" font-size="22">?</text></svg>
