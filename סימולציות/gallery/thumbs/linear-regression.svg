<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.pl{transform-box:view-box;transform-origin:325px 215px;animation:tilt 7s ease-in-out infinite}
.p{animation:bob 3s ease-in-out infinite}
