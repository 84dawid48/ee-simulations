<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.ln{animation:fit 4s ease-in-out infinite alternate;transform-origin:320px 190px}@keyframes fit{from{transform:rotate(-16deg)}to{transform:rotate(5deg)}}
.cl{animation:pul 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.c2{animation-delay:-.8s}.c3{animation-delay:-1.6s}
@keyframes pul{0%,100%{opacity:.22;transform:scale(.9)}50%{opacity:.5;transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="b" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#0d2238"/><stop offset="1" stop-color="#05070d"/></radialGradient></defs>
<rect width="640" height="360" fill="url(#b)"/>
<circle class="cl" cx="160" cy="250" r="62" fill="#f43f5e"/><circle class="cl c2" cx="320" cy="118" r="62" fill="#38bdf8"/><circle class="cl c3" cx="490" cy="230" r="62" fill="#22c55e"/>
<g fill="#ffe4ea"><circle cx="140" cy="240" r="6"/><circle cx="175" cy="265" r="6"/><circle cx="150" cy="280" r="6"/><circle cx="185" cy="230" r="6"/><circle cx="125" cy="262" r="6"/></g>
<g fill="#e0f4ff"><circle cx="300" cy="108" r="6"/><circle cx="335" cy="128" r="6"/><circle cx="320" cy="93" r="6"/><circle cx="345" cy="103" r="6"/><circle cx="305" cy="138" r="6"/></g>
<g fill="#dcfce7"><circle cx="470" cy="220" r="6"/><circle cx="505" cy="245" r="6"/><circle cx="490" cy="205" r="6"/><circle cx="515" cy="225" r="6"/><circle cx="475" cy="255" r="6"/></g>
<line class="ln" x1="40" y1="300" x2="600" y2="80" stroke="#ffd479" stroke-width="5" stroke-linecap="round"/>
</svg>
