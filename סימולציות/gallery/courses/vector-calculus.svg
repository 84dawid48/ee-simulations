<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.sw{animation:spin 12s linear infinite;transform-origin:320px 180px}
.wh{animation:spin 2.6s linear infinite;transform-origin:530px 180px}
.pt{animation:spin 5s linear infinite;transform-origin:320px 180px}.p2{animation-delay:-1.7s}.p3{animation-delay:-3.3s}
.src{animation:br 1.8s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes br{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="b" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#1a1640"/><stop offset="1" stop-color="#05070d"/></radialGradient>
