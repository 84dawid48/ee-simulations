<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.ray{stroke-dasharray:110 900;animation:run 2.8s linear infinite}.r2{animation-delay:-.95s}.r3{animation-delay:-1.85s}
@keyframes run{from{stroke-dashoffset:30}to{stroke-dashoffset:-820}}
.p{animation:out 2.8s ease-in-out infinite alternate;transform-origin:320px 300px}
@keyframes out{from{transform:scaleX(.35) scaleY(1.45)}to{transform:scaleX(1.15) scaleY(.75)}}
.laser{animation:gl 1.3s ease-in-out infinite alternate}@keyframes gl{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><radialGradient id="b" cx=".5" cy=".45" r=".85"><stop offset="0" stop-color="#0d2230"/><stop offset="1" stop-color="#05070d"/></radialGradient>
<linearGradient id="ch" x1="0" x2="1"><stop offset="0" stop-color="#5a8cff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ff5a5a"/></linearGradient></defs>
<rect width="640" height="360" fill="url(#b)"/>
<rect x="0" y="100" width="640" height="120" fill="#13203a"/><rect x="0" y="128" width="640" height="64" fill="#1b3f70"/>
<line x1="0" y1="128" x2="640" y2="128" stroke="#8cbeff" stroke-opacity=".5"/><line x1="0" y1="192" x2="640" y2="192" stroke="#8cbeff" stroke-opacity=".5"/>
<g fill="none" stroke-width="5" stroke-linecap="round">
<path class="ray" d="M0 160 L80 128 L160 192 L240 128 L320 192 L400 128 L480 192 L560 128 L640 192" stroke="#46e39a"/>
<path class="ray r2" d="M0 160 L120 128 L240 192 L360 128 L480 192 L600 128 L640 150" stroke="#9ff5c8"/>
<path class="ray r3" d="M0 160 L640 160" stroke="#ffffff"/>
</g>
<rect class="laser" x="6" y="147" width="22" height="26" rx="4" fill="#46e39a"/>
<line x1="40" y1="300" x2="600" y2="300" stroke="#4a5d84" stroke-width="2"/>
<g class="p"><path d="M200 300C270 300 285 240 320 240S370 300 440 300Z" fill="url(#ch)" fill-opacity=".45"/><path d="M200 300C270 300 285 240 320 240S370 300 440 300" fill="none" stroke="#ffd479" stroke-width="4"/></g>
</svg>
