<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>
.s{animation:shift 3s linear infinite}@keyframes shift{to{transform:translateX(-120px)}}
.d{animation:pop 1.5s ease-in-out infinite}.d:nth-child(2n){animation-delay:-.5s}.d:nth-child(3n){animation-delay:-1s}
@keyframes pop{0%,100%{opacity:.6}50%{opacity:1}}
.rep{animation:sl 4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(-26px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
